plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.0'
    testImplementation 'org.hamcrest:hamcrest:3.0'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

task copyFromHtml (type: Copy) {
	from 'src/main/html'
	into "$buildDir/reports" 
}

task copyFromDocs (type: Copy) {
	dependsOn javadoc
	from "$buildDir/docs"
	into "$buildDir/reports"
}

task reports {
	dependsOn build
	dependsOn copyFromHtml
	dependsOn copyFromDocs
}

gitPublishCopy.dependsOn reports

gitPublish {
	repoUri = 'git@github.com:ODU-CS350-F26/CS350--lab4-documentation--njohnston22.git'
	branch = 'gh-pages'
	contents {
		from "$buildDir/reports"
	}
}

task deployReports {
	dependsOn gitPublishPush
}


	

